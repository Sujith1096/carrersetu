services:
  # FastAPI ML Backend Web Service
  - type: web
    name: careersetu-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careersetu-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://careersetu.vercel.app"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  # Managed PostgreSQL Database
  - name: careersetu-postgres
    plan: free
    region: oregon
    databaseName: careersetu
    user: careersetu_user
